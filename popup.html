<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>OAuth Batch</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 240px; padding: 14px; color: #1e293b; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #0f172a; }
    button { width: 100%; padding: 9px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .blue { background: #2563eb; color: #fff; margin-bottom: 8px; }
    .note { font-size: 11px; color: #64748b; margin-top: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>🔐 OAuth Batch</h1>
  <button id="openPanel" class="blue">📂 Buka Side Panel</button>
  <div class="note">
    Side panel berisi tombol Start/Stop, log, dan koleksi kode OAuth yang terkumpul. Buka panel dulu, lalu klik Start di sana.
  </div>
  <script src="popup.js"></script>
</body>
</html>
